name: RF-RECON Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RF//RECON APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Install Android SDK packages required by app/build.gradle.kts (compileSdk 35).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # The repository currently has no Gradle Wrapper. Install Gradle 8.9
      # directly; AGP 8.7.3 requires Gradle 8.9 or newer.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          sdkmanager --list_installed

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: RF-RECON-Android-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: RF-RECON-Build-Reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
